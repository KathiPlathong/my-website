<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Project Manager</title>

    <link
        rel="stylesheet"
        href="cssindex6.css"> 

</head>


<body>


    <!-- ========================================
         Header
    ========================================= -->

    <header class="header">

        <h1>My Project Manager</h1>

        <p>JavaScript Project</p>

    </header>



    <!-- ========================================
         Main
    ========================================= -->

    <main class="container">


        <!-- ====================================
             Add / Edit Form
        ===================================== -->

        <section class="form-section">

            <h2>Add Project</h2>


            <input
                type="text"
                id="projectName"
                placeholder="Project Name">


            <input
                type="text"
                id="technology"
                placeholder="Technology">


            <button id="addButton">
                Add Project
            </button>

        </section>



        <!-- ====================================
             Project List
        ===================================== -->

        <section class="project-section">

            <h2>My Projects</h2>


            <!-- Search -->

            <input
                type="text"
                id="searchProject"
                placeholder="Search Project...">



            <!-- Filter -->

            <div class="filter-buttons">

                <button data-tech="All">
                    All
                </button>

                <button data-tech="HTML">
                    HTML
                </button>

                <button data-tech="CSS">
                    CSS
                </button>

                <button data-tech="JavaScript">
                    JavaScript
                </button>

                <button data-tech="Python">
                    Python
                </button>

            </div>



            <!-- Project Cards -->

            <div
                id="projectList"
                class="project-grid">
            </div>

        </section>


    </main>



    <!-- ========================================
         JavaScript
    ========================================= -->
     
    <script src="jsindex6.js"></script> 

</body>

</html>
